spring.liquibase.enabled=false
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME is required}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:?SPRING_DATASOURCE_PASSWORD is required}
spring.datasource.driver-class-name=org.postgresql.Driver
# El perfil local persiste evidencia fuera del repositorio; Docker sobrescribe este valor con EVIDENCE_STORAGE_PATH.
evidence.storage-path=${EVIDENCE_STORAGE_PATH:${user.home}/.alertamujer/evidence}
